<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail - Email Tạm Thời | khoahoctietkiem.site</title>
    <meta name="description" content="Dịch vụ email tạm thời miễn phí. Nhận email xác minh nhanh chóng với @khoahoctietkiem.site. Bảo vệ quyền riêng tư của bạn.">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#f8fafc',
                        foreground: '#0f172a',
                        card: '#ffffff',
                        border: '#e2e8f0',
                        primary: {
                            DEFAULT: '#2563eb',
                            hover: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #viewer-content-wrapper { position: relative; }
        #viewer-content-wrapper iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-border shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-primary text-white p-2 rounded-lg">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">TempMail</h1>
                    <p class="text-xs text-gray-500">Email tạm thời miễn phí</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Address Bar -->
    <section class="bg-white border-b border-border py-6">
        <div class="max-w-3xl mx-auto px-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1 relative">
                    <input type="text" id="email-input" readonly
                        class="w-full pl-4 pr-12 py-3 bg-gray-50 border border-border rounded-xl text-lg font-medium text-center sm:text-left shadow-inner cursor-pointer"
                        placeholder="Đang tạo email..."
                        onclick="copyEmail()">
                    <button onclick="copyEmail()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors" title="Copy">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <button onclick="generateNewAddress()" class="px-6 py-3 bg-primary text-white font-medium rounded-xl hover:bg-primary-hover transition-colors shadow-sm flex items-center justify-center gap-2">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.44l5.67-5.67"/>
                    </svg>
                    Tạo mới
                </button>
            </div>
            <!-- Toast Copy -->
            <div id="copy-toast" class="hidden text-green-600 text-sm font-medium text-center mt-2">
                Đã sao chép vào clipboard!
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6 relative">
        
        <!-- Sidebar: Email List -->
        <div id="list-view" class="bg-white rounded-xl border border-border shadow-sm flex flex-col h-[600px] overflow-hidden md:col-span-1">
            <div class="p-4 border-b border-border bg-gray-50 flex items-center justify-between">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                    Hộp thư đến
                    <span id="email-count" class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full">0</span>
                </h2>
                <div class="flex items-center gap-2">
                    <span id="countdown" class="text-xs font-mono text-gray-500">15s</span>
                    <button onclick="fetchEmails(true)" id="refresh-btn" class="p-1.5 text-gray-500 hover:text-primary hover:bg-blue-50 rounded-lg transition-colors">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="email-list" class="overflow-y-auto flex-1 p-2 space-y-1">
                <!-- Emails injected here -->
                <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-4">
                    <div class="spinner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-8 h-8 text-blue-500">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                        </svg>
                    </div>
                    <p class="text-sm">Đang tải...</p>
                </div>
            </div>
        </div>

        <!-- Viewer -->
        <div id="viewer-container" class="hidden md:flex bg-white rounded-xl border border-border shadow-sm flex-col h-[600px] overflow-hidden md:col-span-2 absolute inset-0 z-10 md:static md:z-auto">
            
            <!-- Viewer Placeholder -->
            <div id="viewer-placeholder" class="flex flex-col items-center justify-center h-full text-gray-400 bg-gray-50/50">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-16 h-16 mb-4 text-gray-300">
                    <path d="M4 7.00005L10.2 11.65C11.2667 12.45 12.7333 12.45 13.8 11.65L20 7"/>
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                </svg>
                <p class="font-medium text-gray-500">Chọn một email để đọc</p>
            </div>

            <!-- Viewer Loading -->
            <div id="viewer-loading" class="hidden flex-col items-center justify-center h-full text-blue-500">
                <div class="spinner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-8 h-8">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                </div>
            </div>

            <!-- Viewer Active -->
            <div id="viewer-active" class="hidden flex-col h-full">
                <div class="p-4 border-b border-border bg-white flex items-start gap-4">
                    <!-- Mobile Back Button -->
                    <button onclick="closeViewer()" class="md:hidden mt-1 p-2 -ml-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    
                    <div class="flex-1 min-w-0">
                        <h2 id="viewer-subject" class="text-xl font-bold text-gray-900 mb-2 truncate">Subject</h2>
                        <div class="flex items-center gap-3 text-sm text-gray-500">
                            <div class="bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center font-bold text-gray-700 shrink-0" id="viewer-avatar">
                                A
                            </div>
                            <div class="truncate flex-1">
                                <span class="font-medium text-gray-900" id="viewer-from-name">Sender</span>
                                <span class="text-gray-500 ml-1" id="viewer-from-email">&lt;sender@email.com&gt;</span>
                            </div>
                            <div class="whitespace-nowrap" id="viewer-date">Date</div>
                        </div>
                    </div>
                </div>
                
                <div class="flex-1 bg-white relative overflow-hidden" id="viewer-content-wrapper">
                    <!-- Iframe injected here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-500 text-sm">
        <p>© 2026 TempMail - khoahoctietkiem.site</p>
    </footer>

    <!-- Scripts -->
    <script src="/app.js"></script>
</body>
</html>
